name: Build and Publish Release APK(opt)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Enter the release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ci-release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Read Versions
        run: |
          echo "XRAY_VERSION=$(grep 'XRAY_CORE_VERSION' version.properties | cut -d '=' -f 2 | tr -d '\r ')" >> $GITHUB_ENV
          echo "GO_VERSION=$(grep 'GO_VERSION' version.properties | cut -d '=' -f 2 | tr -d '\r ')" >> $GITHUB_ENV

          if [ "${{ github.event_name }}" == "push" ]; then
            RELEASE_VERSION="${{ github.ref_name }}"
          else
            RELEASE_VERSION="${{ github.event.inputs.release_tag }}"
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid release tag: $RELEASE_VERSION" >&2
            exit 1
          fi

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Set up Go (latest stable for better performance)
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'   # override version.properties – you can also use 1.23
          cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Download Rules Files
        run: |
          mkdir -p ./app/src/main/assets/
          wget https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geoip.dat -O ./app/src/main/assets/geoip.dat
          wget https://raw.githubusercontent.com/Chocolate4U/Iran-v2ray-rules/release/geosite.dat -O ./app/src/main/assets/geosite.dat

      - name: Build Xray-core from Source (with optimizations)
        run: |
          wget -qO android-ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q android-ndk.zip
          rm android-ndk.zip
          NDK_HOME=$(realpath android-ndk-*)

          git clone --depth=1 --branch ${{ env.XRAY_VERSION }} https://github.com/patterniha/Xray-core.git
          cd Xray-core
          COMMID=$(git rev-parse HEAD | cut -c 1-7)

          export GOOS=android
          export CGO_ENABLED=1
          export GOARCH=arm64
          export CC=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang

          # PERFORMANCE FLAGS (keep these – they work)
          export CGO_CFLAGS="-O3 -flto -march=armv8-a+crc+crypto -mtune=cortex-a76"
          export CGO_LDFLAGS="-flto -O3"
          # We removed the invalid GOFLAGS line – now only these two are set

          go build -o xray -trimpath -buildvcs=false \
            -ldflags="-X github.com/patterniha/xray-core/core.build=${COMMID} -s -w -buildid= -checklinkname=0" \
            -v ./main

          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          mv xray ../app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Generate signing keystore
        run: |
          keytool -genkey -v -keystore release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias temp_alias \
            -storepass android -keypass android \
            -dname "CN=Temp, OU=Temp, O=Temp, L=Temp, ST=Temp, C=US" \
            -storetype PKCS12
          echo "KEY_STORE_PASSWORD=android" >> $GITHUB_ENV
          echo "KEY_ALIAS=temp_alias" >> $GITHUB_ENV
          echo "KEY_PASSWORD=android" >> $GITHUB_ENV

      - name: Build release APK (with R8 full optimisation)
        run: |
          bash ./gradlew assembleRelease --parallel --build-cache \
            -x lint \
            -PappVerName=${{ env.RELEASE_VERSION }} \
            -Pandroid.enableR8.fullMode=true \
            -Pandroid.enableR8.librariesShrink=true \
            -Pandroid.enableR8.dexShrink=true
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ env.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/simplexray-arm64-v8a.apk SimpleXray-arm64-v8a-${{ env.RELEASE_VERSION }}.apk

      - name: Generate release notes
        shell: bash
        run: |
          CURRENT_TAG="${RELEASE_VERSION}"
          PREV_TAG="$(git tag --sort=-v:refname | grep -Fxv "$CURRENT_TAG" | head -n 1 || true)"
          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_TAG"
          else
            RANGE="$PREV_TAG...$CURRENT_TAG"
          fi
          bash .github/scripts/gen_release_notes.sh -r "$RANGE" -o release.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_VERSION }}
          release_name: ${{ env.RELEASE_VERSION }}
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          draft: false
          generate_release_notes: false
          body_path: release.md
          files: |
            SimpleXray-arm64-v8a-${{ env.RELEASE_VERSION }}.apk
